<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Housing UI preview</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font-family: Inter, Segoe UI, sans-serif; background: #101118; color: #f4f6fb; }
    main { max-width: 1100px; margin: 0 auto; padding: 32px 20px 64px; }
    h1 { font-size: 28px; margin: 0 0 8px; }
    p { color: #8b93a7; }
    a { color: #ff7a18; }
    figure { margin: 28px 0; }
    img { width: 100%; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); }
    figcaption { margin-top: 8px; color: #c8cedc; }
  </style>
</head>
<body>
  <main>
    <h1>Housing UI preview</h1>
    <p>Centered management window, orange <code>#ff7a18</code> on near-black. Open the live menu with <code>npm run dev</code> inside <code>web/</code>.</p>
    <figure><img src="my-house.jpg" alt="My House page" /><figcaption>My House</figcaption></figure>
    <figure><img src="marketplace.jpg" alt="Marketplace" /><figcaption>Marketplace</figcaption></figure>
    <figure><img src="purchase.jpg" alt="Purchase confirmation" /><figcaption>Purchase confirmation</figcaption></figure>
    <figure><img src="bills.jpg" alt="Bills" /><figcaption>Bills</figcaption></figure>
    <figure><img src="keys.jpg" alt="Keys" /><figcaption>Keys</figcaption></figure>
    <figure><img src="permissions.jpg" alt="Permissions" /><figcaption>Permissions</figcaption></figure>
    <figure><img src="upgrades.jpg" alt="Upgrades" /><figcaption>Upgrades</figcaption></figure>
    <figure><img src="furniture.jpg" alt="Order furniture" /><figcaption>Order furniture</figcaption></figure>
    <figure><img src="garage.jpg" alt="Garage" /><figcaption>Garage</figcaption></figure>
  </main>
</body>
</html>
